name: Deploy Azure Commercial
on:
  workflow_run:
    workflows: [ChangeGuard CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch ChangeGuard CI run ID (also used for code rollback)
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: changeguard-azure-target
  cancel-in-progress: false
jobs:
  verify:
    # Set repository variable only after successful PostgreSQL provisioning.
    if: vars.AZURE_POSTGRES_READY == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - id: source
        run: node scripts/ci/select-azure-run.mjs
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
  production:
    needs: verify
    uses: ./.github/workflows/azure-environment.yml
    secrets: inherit
    with:
      environment: azure-infrastructure
      sha: ${{ needs.verify.outputs.sha }}
      artifact_id: ${{ needs.verify.outputs.artifact_id }}
      run_id: ${{ needs.verify.outputs.run_id }}
    permissions:
      contents: read
      actions: read
      id-token: write
