name: Azure PostgreSQL infrastructure
on:
  push:
    branches: [codex/azure-commercial-delivery, main]
    paths:
      - .github/workflows/azure-infrastructure.yml
      - azure/infra/postgres.bicep
      - scripts/ci/azure-infrastructure.py
  workflow_dispatch:
    inputs:
      operation:
        description: Check connection or provision F1 web and paid B1ms PostgreSQL
        type: choice
        options: [check, provision]
        default: provision
      app_name:
        description: Globally unique lowercase Azure app name
        type: string
        default: changeguard-mr-free
      postgres_location:
        description: PostgreSQL region (availability is subscription-specific)
        type: string
        default: eastus

permissions:
  contents: read
concurrency:
  group: changeguard-azure-target
  cancel-in-progress: false
jobs:
  infrastructure:
    if: github.repository == 'mrmarcusriddick/changeguard' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/azure-commercial-delivery')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: azure-infrastructure
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      CG_OPERATION: ${{ inputs.operation || 'check' }}
      CG_APP_NAME: ${{ inputs.app_name || 'changeguard-mr-free' }}
      CG_POSTGRES_LOCATION: ${{ inputs.postgres_location || 'eastus' }}
      CG_DATABASE_PASSWORD: ${{ secrets.CG_DATABASE_PASSWORD }}
      CG_AUTH_CLIENT_ID: ${{ secrets.CG_AUTH_CLIENT_ID }}
      CG_AUTH_CLIENT_SECRET: ${{ secrets.CG_AUTH_CLIENT_SECRET }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate connection configuration
        run: python3 scripts/ci/azure-infrastructure.py inputs
      - name: Sign in to Azure Commercial through GitHub OIDC
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          environment: AzureCloud
      - name: Check resource group access and compile PostgreSQL template
        run: python3 scripts/ci/azure-infrastructure.py check
      - name: Preview and provision F1 web and paid PostgreSQL
        if: inputs.operation == 'provision' && github.event_name == 'workflow_dispatch'
        run: python3 scripts/ci/azure-infrastructure.py provision
