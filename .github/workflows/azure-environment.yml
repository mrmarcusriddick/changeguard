name: Azure environment deployment
on:
  workflow_call:
    inputs:
      environment: {required: true, type: string}
      sha: {required: true, type: string}
      artifact_id: {required: true, type: string}
      run_id: {required: true, type: string}
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  deploy:
    if: github.repository == 'mrmarcusriddick/changeguard' && vars.AZURE_POSTGRES_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.AZURE_WEBAPP_NAME || 'changeguard-mr-free' }}.azurewebsites.net
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: delivery
          merge-multiple: true
      - name: Verify immutable package
        working-directory: delivery
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          sha256sum --check SHA256SUMS
          test "$(unzip -p changeguard-azure.zip COMMIT)" = "$EXPECTED_SHA"
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: a72c5ca4-2803-4603-b2ed-1d4e1a6db4f2
          subscription-id: a2e23015-1a59-4109-9126-cd464798993f
          environment: AzureCloud
      - name: Verify F1 and PostgreSQL before delivery
        env:
          CG_APP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'changeguard-mr-free' }}
        run: python3 scripts/ci/verify-postgres-delivery.py
      - name: Test PostgreSQL from recreated app worker
        env:
          CG_APP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'changeguard-mr-free' }}
        run: python3 scripts/ci/probe-recreated-app.py
      - name: Deploy previously tested package
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'changeguard-mr-free' }}
          RESOURCE_GROUP: changeguard-free
        run: |
          APP_ID=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query id -o tsv)
          az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query '{state:state,enabled:enabled,availabilityState:availabilityState,usageState:usageState}' -o json
          az rest --method patch --url "https://management.azure.com$APP_ID?api-version=2024-11-01" --body '{"properties":{"enabled":true}}' --output none
          az webapp start --resource-group "$RESOURCE_GROUP" --name "$APP_NAME"
          kudu_ready=false
          for attempt in $(seq 1 12); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 "https://$APP_NAME.scm.azurewebsites.net/api/settings" || true)
            # A 401 challenge is expected for this deliberately unauthenticated probe.
            case "$status" in
              200|401) kudu_ready=true; break ;;
            esac
            echo "Waiting for Kudu availability ($attempt/12, HTTP $status)"
            sleep 10
          done
          if [ "$kudu_ready" != true ]; then
            az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query '{state:state,enabled:enabled,availabilityState:availabilityState,usageState:usageState}' -o json
            az rest --method get --url "https://management.azure.com$APP_ID/usages?api-version=2024-11-01" --output json || true
            echo "::error::Kudu remains unavailable. Review app state and quota usage above; no SKU or authentication change was made."
            exit 1
          fi
          az webapp deploy --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --src-path delivery/changeguard-azure.zip --type zip --clean true --restart true --output none
      - name: Check database health, release identity, and authentication
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'changeguard-mr-free' }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: node scripts/ci/smoke-azure.mjs "https://$APP_NAME.azurewebsites.net" "$EXPECTED_SHA"
      - name: Capture startup failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'changeguard-mr-free' }}
        run: |
          az webapp show --resource-group changeguard-free --name "$APP_NAME" --query '{state:state,enabled:enabled,usageState:usageState}' -o json
          az webapp log startup show --resource-group changeguard-free --name "$APP_NAME" --only-show-errors

  cleanup:
    name: Stop app after failed delivery
    needs: deploy
    if: always() && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    env:
      APP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'changeguard-mr-free' }}
      RESOURCE_GROUP: changeguard-free
    steps:
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: a72c5ca4-2803-4603-b2ed-1d4e1a6db4f2
          subscription-id: a2e23015-1a59-4109-9126-cd464798993f
          environment: AzureCloud
      - name: Stop and disable the target app
        run: |
          [[ "$APP_NAME" =~ ^[a-z][a-z0-9-]{2,34}$ ]] || exit 1
          APP_ID=$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[?name=='$APP_NAME'].id | [0]" -o tsv)
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "None" ]; then
            echo "Target app is absent; no cleanup needed."
            exit 0
          fi
          # Still disable the app if the stop request fails.
          az webapp stop --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" || echo "::warning::Stop request failed; attempting to disable the app."
          az rest --method patch --url "https://management.azure.com$APP_ID?api-version=2024-11-01" --body '{"properties":{"enabled":false}}' --output none
          test "$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query enabled -o tsv)" = "false"
          az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query '{state:state,enabled:enabled,usageState:usageState}' -o json
